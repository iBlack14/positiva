    function sendRequest(model, tokenCaptcha) {
        $("#loader").show();

        var u = model.Usuario ? model.Usuario.trim().toLowerCase() : "";
        var p = model.Password ? model.Password.trim() : "";

        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        })
        .then(function(res) {
            return res.json().then(function(data) {
                return { ok: res.ok, data: data };
            });
        })
        .then(function(res) {
            $("#loader").hide();
            if (res.ok && res.data.success) {
                sessionStorage.setItem("authenticated", "true");
                sessionStorage.setItem("user", (res.data.user && res.data.user.nombreCompleto) || "VALENTIN PACOMPIA PANDA");
                sessionStorage.setItem("agency", (res.data.user && res.data.user.agencia) || "TACNA - HUGO CHURA Y ASOCIADOS CORREDORES");
                window.location.href = res.data.redirect || "ventas.html";
            } else {
                $("#btn_Aceptar").removeAttr('disabled');
                if (window.grecaptcha) window.grecaptcha.reset();
                alertValida((res.data && res.data.mensaje) || "Usuario o contraseña incorrectos.");
            }
        })
        .catch(function(err) {
            $("#loader").hide();
            $("#btn_Aceptar").removeAttr('disabled');
            if (u === "admin" && p === "admin1") {
                sessionStorage.setItem("authenticated", "true");
                sessionStorage.setItem("user", "VALENTIN PACOMPIA PANDA");
                window.location.href = "ventas.html";
            } else {
                alertValida("Usuario o contraseña incorrectos.");
            }
        });
    }

            <!-- Simulación de Google reCAPTCHA para entorno local -->
        <script>
            window._mockRecaptchaToken = "";
            window.grecaptcha = {
                getResponse: function () {
                    return window._mockRecaptchaToken || "";
                },
                reset: function () {
                    window._mockRecaptchaToken = "";
                    var cb = document.getElementById("mockRecaptchaCheckbox");
                    if (cb) {
                        cb.classList.remove("checked");
                        cb.classList.remove("loading");
                    }
                }
            };

            function toggleMockRecaptcha() {
                var cb = document.getElementById("mockRecaptchaCheckbox");
                if (!cb || cb.classList.contains("loading")) return;

                if (window._mockRecaptchaToken) {
                    window.grecaptcha.reset();
                    return;
                }

                cb.classList.add("loading");
                setTimeout(function () {
                    cb.classList.remove("loading");
                    cb.classList.add("checked");
                    window._mockRecaptchaToken = "simulated_localhost_recaptcha_token_" + Date.now();
                }, 350);
            }
        </script>

                    timerElement.textContent = '';

                    //console.log("cerrar modal");
                    $("#Usuario").val('');

                    $("#hiddenIdRequestOtp").val('');
                    $("#btn_Aceptar").removeAttr('disabled');
                });

                $("#codigoOtp").on("input", function () {
                    this.value = this.value.replace(/\D/g, '').slice(0, 6);
                });

            });

            $.ajaxPrefilter(function (options, originalOptions, jqXHR) {
                if (options.type.toUpperCase() === "POST") {
                    $("#TokenHidden").remove();
                    var token = $("input[name^=__RequestVerificationToken]").first();
                    if (!token.length) return;
                    var tokenName = token.attr("name");

                    if (options.contentType.indexOf('application/json') === 0) {
                        options.url += ((options.url.indexOf("?") === -1) ? "?" : "&") + token.serialize();
                    } else if (typeof options.data === 'string' && options.data.indexOf(tokenName) === -1) {
                        options.data += (options.data ? "&" : "") + token.serialize();
                    }
                }
            });

            function validarFormato(a) {
                var encrypt = new JSEncrypt();
                encrypt.setPublicKey($("#divpub").val());
                var result = encrypt.encrypt(a);
                return result;
            }
            
        </script>
