        /* Estilos para reCAPTCHA simulado en Localhost */

            text-decoration: none !important;

        .mock-spinner {

            width: 24px;
            height: 24px;
            animation: mock-rot 1.2s linear infinite;

            stroke: #4285F4;
            stroke-linecap: round;
            animation: mock-dash 1.2s ease-in-out infinite;

        @keyframes mock-rot {
            100% { transform: rotate(360deg); }
        }
        @keyframes mock-dash {
            0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; }

    <!-- Funciones Globales del Portal de Acceso -->
    <script>
        var nameAplicativo = '/';
        var bReCaptcha = '1';
        var ServiceIpp = 'https://api.ipify.org?format=json';
        var ipPublica = '0.0.0.0';
        window._mockRecaptchaToken = "";

        // Funciones de validación de teclas
        window.validakeyespacioblanco = function(e) {
            var ev = e || window.event;
            var k = ev ? (ev.keyCode || ev.which) : 0;
            if (k === 32) {
                if (ev && ev.preventDefault) ev.preventDefault();
                if (ev) ev.returnValue = false;
                return false;
            }
            return true;
        };

        window.validakeyOnlyNumbers = function(e) {
            var ev = e || window.event;
            var k = ev ? (ev.keyCode || ev.which) : 0;
            if (k > 31 && (k < 48 || k > 57)) {
                if (ev && ev.preventDefault) ev.preventDefault();
                if (ev) ev.returnValue = false;
                return false;
            }
            return true;
        };

        window.presionaEnter = function(e) {
            var ev = e || window.event;
            var k = ev ? (ev.keyCode || ev.which) : 0;
            if (k === 13) {
                window.logueo();
            }
        };

        // Simulación reCAPTCHA
        window.grecaptcha = {
            getResponse: function () {
                return window._mockRecaptchaToken || "";
            },
            reset: function () {
                window._mockRecaptchaToken = "";
                var cb = document.getElementById("mockRecaptchaCheckbox");
                if (cb) {
                    cb.classList.remove("checked");
                    cb.classList.remove("loading");
                }
            }
        };

        window.toggleMockRecaptcha = function() {
            var cb = document.getElementById("mockRecaptchaCheckbox");
            if (!cb || cb.classList.contains("loading")) return;

            if (window._mockRecaptchaToken) {
                window.grecaptcha.reset();
                return;
            }

            cb.classList.add("loading");
            setTimeout(function () {
                cb.classList.remove("loading");
                cb.classList.add("checked");
                window._mockRecaptchaToken = "simulated_localhost_recaptcha_token_" + Date.now();
            }, 350);
        };

        // Alertas
        window.alertValida = function(mensaje) {
            if (window.BootstrapDialog && typeof window.BootstrapDialog.show === 'function') {
                var $textAndPic = $('<div></div>');
                $textAndPic.append(' <i class="icono_alerta_modal"><img src="Images/iconos/color/icono-alerta.png" alt="" style="width:35px; margin-right:8px;"></i> ');
                $textAndPic.append('<div class="content_texto_modal" style="display:inline-block;"><span class="error-msg">' + mensaje + '</span></div>');
                BootstrapDialog.show({
                    title: 'Alerta',
                    cssClass: 'actualiza-datos',
                    type: BootstrapDialog.TYPE_WARNING,
                    message: $textAndPic,
                    closable: false,
                    buttons: [{
                        cssClass: 'btn-principal',
                        label: 'Aceptar',
                        action: function (dialogRef) {
                            dialogRef.close();
                        }
                    }]
                });
            } else {
                alert(mensaje);
            }
        };

        window.mostrarAlerta = function(mensaje) {
            var el = document.getElementById('mensajeAlertaPersonalizada');
            if (el) el.textContent = mensaje;
            var box = document.getElementById('alertaPersonalizada');
            if (box) box.style.display = 'block';
        };

        window.ocultarAlertaPersonalizada = function() {
            var box = document.getElementById('alertaPersonalizada');
            if (box) box.style.display = 'none';
        };

        window.recuperarContrasena = function() {
            window.alertValida('Para restablecer su clave comuníquese con el administrador del sistema.');
        };

        // Función Principal de Inicio de Sesión
        window.logueo = function() {
            var btn = $("#btn_Aceptar");
            btn.prop("disabled", true);

            var usuarioInput = $("#Usuario");
            var passwordInput = $("#Password");
            var usuario = usuarioInput.val() ? usuarioInput.val().trim() : "";
            var password = passwordInput.val() ? passwordInput.val().trim() : "";

            if (usuario === "") {
                window.alertValida("Debe ingresar su nombre de Usuario.");
                usuarioInput.focus();
                btn.removeAttr('disabled');
                return false;
            }
            if (password === "") {
                window.alertValida("Debe ingresar su Password.");
                passwordInput.focus();
                btn.removeAttr('disabled');
                return false;
            }

            // Auto-validar el captcha si no se ha hecho clic
            if (!window._mockRecaptchaToken) {
                var cb = document.getElementById("mockRecaptchaCheckbox");
                if (cb) cb.classList.add("checked");
                window._mockRecaptchaToken = "simulated_localhost_recaptcha_token_" + Date.now();
            }

            $("#loader").show();

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: usuario.toLowerCase(),
                    password: password
                })
            })
            .then(function(res) {
                return res.json().then(function(data) {
                    return { ok: res.ok, data: data };
                });
            })
            .then(function(res) {
                $("#loader").hide();
                if (res.ok && res.data.success) {
                    sessionStorage.setItem("authenticated", "true");
                    sessionStorage.setItem("user", (res.data.user && res.data.user.nombreCompleto) || "Administrador");
                    sessionStorage.setItem("agency", (res.data.user && res.data.user.agencia) || "Agencia Principal");
                    sessionStorage.setItem("rol", (res.data.user && res.data.user.rol) || "ADMIN");
                    window.location.href = res.data.redirect || "ventas.html";
                } else {
                    btn.removeAttr('disabled');
                    window.grecaptcha.reset();
                    window.alertValida((res.data && res.data.mensaje) || "Usuario o contraseña incorrectos.");
                }
            })
            .catch(function(err) {
                $("#loader").hide();
                btn.removeAttr('disabled');
                window.alertValida("Error de conexión al autenticar. Verifique que el servidor esté activo.");
            });
        };

        $(document).ready(function() {
            $("#Usuario").focus();
            // Pre-marcar el captcha simulado para agilizar pruebas en entorno local
            window.toggleMockRecaptcha();
        });
    </script>
