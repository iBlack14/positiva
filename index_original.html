    function validakeyespacioblanco() {
        var e_k = event.keyCode;
        if (e_k == 32) {
            event.returnValue = false;
        }
        else {
            event.returnValue = true;
        }
    }

    function validakeyOnlyNumbers() {
        return event.charCode >= 48 && event.charCode <= 57
    }

    function logueo() {
        $("#btn_Aceptar").prop("disabled", true);
        if ($("#Usuario").val() == "") {
            alertValida("Debe ingresar su nombre de Usuario.");
            $("#Usuario").focus();
            $("#btn_Aceptar").removeAttr('disabled');
            return false;
        }
        if ($("#Password").val() == "") {

            $("#btn_Aceptar").removeAttr('disabled');
            return false;
        }

        var usuario = $("input#Usuario").val();
        var password = $("input#Password").val();

        if (bReCaptcha == "1") {

            if (tokenCaptcha.length === 0)
            {
                alertValida("Debe completar el Captcha.");
                $("#btn_Aceptar").removeAttr('disabled');
                return false;
            }

            var model = {
                Usuario: usuario.trim(),
                Password: password.trim(),
                Publica: ipPublica,
                CodigoOtp: '',
            };
            sendRequest(model, tokenCaptcha);
        } else {
            var model = {
                Usuario: usuario.trim(),
                Password: password.trim(),
                Publica: ipPublica,
                Key: '',
                Captcharesponse: '',
                CodigoOtp: '',
            };
            sendRequest(model);
        }
    }

        function sendRequest(model, tokenCaptcha) {
            $.ajax({
                url: "/Home/Ingreso",
                type: "POST",
                data: {
                    sData: validarFormato(JSON.stringify(model)),
                    sTokenCaptcha: tokenCaptcha
                },
                dataType: "json",
                beforeSend: function () {
                    $("#loader").show(); // Mostrar el loader antes de enviar la solicitud
                },
                success: function (data) {
                    if (data) {
                        var arrSalida = data.mensajes.split('|'); // RQ2020-180
                        var mens = arrSalida[0];
                        var pwd_valor = data.FlagPwdActualizada;


                        if (pwd_valor !== "1") {
                            $.ajax({
                                url: nameAplicativo + "CambiarClaveInicio/CambioContrasena",
                                type: 'GET',
                                async: true,
                                cache: false,
                                success: function (data) {
                                    $("#CambiarClaveupd").html(data);
                                    $("#H").html("");
                                    if (pwd_valor === "2") {
                                        $("#H").html("Cambiar de Contraseña-Primer Ingreso");
                                    } else {
                                        $("#H").html("Cambiar de Contraseña-Excedió los 90 días");
                                    }
                                    $('#verCambiarClaveupd').modal('show');
                                },
                                error: function () {
                                    $("#loader").hide();
                                    alert("Se produjo un error al obtener los datos.");
                                }, complete: function () {
                                    $("#loader").hide();
                                }
                            });
                            $("#btn_Aceptar").removeAttr('disabled');
                        } else {
                            if (mens === "OK") {                            
                                if (data.VistaListadoVentas == 1) {
                                    var urlVenta = "/Ventas/ListarVentas";
                                    window.location.href = urlVenta;
                                } else if (data.VistaPlanilla == 1) {
                                    var urlPlanilla = "/Planilla";
                                    window.location.href = urlPlanilla;
                                } else {
                                    var urlHome = "/Home/Vista";
                                    window.location.href = urlHome;
                                }
                            } else if (mens === "COMPLETAR_OTP") {
                                $("#loader").hide();
                                var IdRequestOtp = data.IdRequestOtp;

                                if (IdRequestOtp === "0") {
                                    var menRes = arrSalida[1];
                                    //console.log("envio -> menRes", menRes);
                                    if (menRes === "") {
                                        mostrarAlerta('Estimado usuario, se presenta problemas con el envío del código de verificación.');
                                    } else {
                                        mostrarAlerta(menRes);
                                    }
                                    $("#hiddenIdRequestOtp").val('');
                                    $("#hiddenModalOtp1").val('');
                                    $("#hiddenModalOtp2").val('');
                                    $("#hiddenModalOtp3").val('');
                                    $("#hiddenTiempoValOtp").val('');
                                    $("#Usuario").val('');
                                    $("#Password").val('');

                                    $("#btn_Aceptar").removeAttr('disabled');
                                } else {
                                    $("#hiddenIdRequestOtp").val('');
                                    $("#hiddenModalOtp1").val('');
                                    $("#hiddenModalOtp2").val('');
                                    $("#hiddenModalOtp3").val('');
                                    $("#hiddenTiempoValOtp").val('');
                                    $("#codigoOtp").val('');
                                
                                    //$("input#Usuario").attr('disabled', 'disabled');
                                    //$("input#Password").attr('disabled', 'disabled');
                                    //$("input#Password").removeAttr('disabled');                                 
                                
                                    $("#hiddenIdRequestOtp").val(IdRequestOtp);
                                    $("#hiddenModalOtp1").val(arrSalida[1]);
                                    $("#hiddenModalOtp2").val(arrSalida[2]);
                                    $("#hiddenModalOtp3").val(arrSalida[3]);
                                    $("#hiddenTiempoValOtp").val(data.TiempoValOtp);
                                
                                    $("#btn_Aceptar").removeAttr('disabled');
                                    iniciarTimer();
                                    $('#validarOtpParam').modal('show');
                                }
                            } else if (mens === "actualizarDatos") { // INI RQ2020-180
                                $("#loader").hide();
                                //console.log(arrSalida[1]);
                                alertValidaLogin('Estimado usuario, por motivos de seguridad se debe actualizar sus datos.', arrSalida[1]);
                                $("#btn_Aceptar").removeAttr('disabled');
                            } else if (mens === "Azure") {
                                $("#loader").hide();
                                location.href = arrSalida[1]; // RQ2023-473
                            } else if (mens === "ULTIMO_INTENTO") {
                                $("#loader").hide();
                                alertRedireccion("Este es el último intento, si falla en la clave, el usuario será bloqueado.", "/Home");
                            } else {
                                $("#loader").hide();
                                alertRedireccion(mens, "/Home");
                                $("#btn_Aceptar").removeAttr('disabled');
                            }
                        }
                    }
                },
                error: function (xhr, status, error) {
                    //console.error("Error:", error);
                    $("#loader").hide();
                    $("#btn_Aceptar").removeAttr('disabled');
                }
            });
        }

        function validarCodigoOtp() {
            //$("#btn_Aceptar").prop("disabled", true);
            $("#btn_Reenviar").prop("disabled", true);
            $("#btn_ValidarOtp").prop("disabled", true);            

            if ($("#Usuario").val() == "") {
                mostrarAlerta("Debe ingresar su nombre de Usuario.");
                $("#Usuario").focus();
                $("#btn_Reenviar").removeAttr('disabled');
                $("#btn_ValidarOtp").removeAttr('disabled');
                return false;
            }
            if ($("#Password").val() == "") {
                mostrarAlerta("Debe ingresar su Password.");
                $("#Password").focus();
                $("#btn_Reenviar").removeAttr('disabled');
                $("#btn_ValidarOtp").removeAttr('disabled');
                return false;
            }

            if ($("#codigoOtp").val() == "") {
                mostrarAlerta("Debe ingresar el código de verificación.");
                $("#codigoOtp").focus();
                $("#btn_Reenviar").removeAttr('disabled');
                $("#btn_ValidarOtp").removeAttr('disabled');
                return false;
            }

            if ($("#codigoOtp").val() != "" && $("#codigoOtp").val().length !== 6) {
                mostrarAlerta("El código de verificación debe tener 6 dígitos.");
                $("#codigoOtp").focus();
                $("#btn_Reenviar").removeAttr('disabled');
                $("#btn_ValidarOtp").removeAttr('disabled');
                return false;
            }

            if ($("#hiddenIdRequestOtp").val() == "") {
                mostrarAlerta("Debe haber solicitado un código de verificación.");
                $("#btn_Reenviar").removeAttr('disabled');
                $("#btn_ValidarOtp").removeAttr('disabled');
                return false;
            }
            
            var usuario = $("input#Usuario").val();
            var password = $("input#Password").val();
            var codigoOtp = $("#codigoOtp").val(); // $("input#CodigoOtp").val();
            var idRequestOtp = $("#hiddenIdRequestOtp").val();
            //console.log("validarCodigoOtp.idRequestOtp ->", idRequestOtp);
            
            if (bReCaptcha == "1") {
                var tokenCaptcha = grecaptcha.getResponse();

                //if (tokenCaptcha.length === 0) {
                //    mostrarAlerta("Debe completar el Captcha.");
                //    $("#btn_Reenviar").removeAttr('disabled');
                //    $("#btn_ValidarOtp").removeAttr('disabled');
                //    return false;
                //}

                var model = {
                    Usuario: usuario.trim(),
                    Password: password.trim(),
                    Publica: ipPublica,
                    CodigoOtp: codigoOtp,
                    IdRequestOtp: idRequestOtp,
                };
                sendRequestValidarCodigoOtp(model, tokenCaptcha);
            } else {
                var model = {
                    Usuario: usuario.trim(),
                    Password: password.trim(),
                    Publica: ipPublica,
                    Key: '',
                    Captcharesponse: '',
                    CodigoOtp: codigoOtp,
                    IdRequestOtp: idRequestOtp,
                };
                sendRequestValidarCodigoOtp(model);
            }
        }

        function sendRequestReenviarCodigoOtp(model, tokenCaptcha) {
            $.ajax({
                url: "/Home/ReenviarCodigoOtp",
                type: "POST",
                data: {
                    sData: validarFormato(JSON.stringify(model)),
                    sTokenCaptcha: tokenCaptcha
                },
                dataType: "json",
                beforeSend: function() {
                    $("#loader").show();
                },
                success: function(data) {
                    if (data) {
                        var arrSalida = data.mensajes.split('|');
                        var mens = arrSalida[0];
                        var pwd_valor = data.FlagPwdActualizada;
                        var reenvioCodigoOtp = data.ReenvioCodigoOtp;
                        var IdRequestOtp = data.IdRequestOtp;
                        var reiniciarPassword = data.ReiniciarPassword;
                        //console.log("Reenviar -> reenvioCodigoOtp", reenvioCodigoOtp);
                        //console.log("Reenviar -> IdRequestOtp", IdRequestOtp);
                        //console.log("Reenviar -> data.mensajes", data.mensajes);
                        //console.log("Reenviar -> data.TiempoValOtp", data.TiempoValOtp);
                        //console.log("Reenviar -> reiniciarPassword", reiniciarPassword);

                        if (reenvioCodigoOtp === "1") {
                            $("#hiddenIdRequestOtp").val('');
                            $("input#Usuario").attr('disabled', 'disabled');
                            $("input#Password").attr('disabled', 'disabled');
                            $("#loader").hide();                            
                            $("#btn_ValidarOtp").removeAttr('disabled');
                            $("#hiddenIdRequestOtp").val(IdRequestOtp);
                            $("#hiddenTiempoValOtp").val(data.TiempoValOtp);

                            iniciarTimer();
                            //mostrarAlerta('Reenvió del código de verificación con éxito');
                            mostrarAlerta(mens);
                        } else { 
                            $("#loader").hide();
                            //mostrarAlerta('Estimado usuario, se presenta problemas con el reenvío del código de verificación.', '');
                            mostrarAlerta(mens);
                            $("#btn_ValidarOtp").removeAttr('disabled');
                            if (reiniciarPassword === "1") {
                                $("#cerrarValidarOtp").click();
                            }
                        }
                    }
                },
                error: function(xhr, status, error) {
                    console.error("Error:", error);
                    console.error("status:", status);
                    mostrarAlerta('Estimado usuario, se presenta problemas con el reenvío del código de verificación.');
                    $("#loader").hide();
                    $("#btn_ValidarOtp").removeAttr('disabled');
                }
            });
        }

        function sendRequestValidarCodigoOtp(model, tokenCaptcha)
        {
            $.ajax({
                url: "/Home/ValidarCodigoOtp",
                type: "POST",
                data: {
                    sData: validarFormato(JSON.stringify(model)),
                    sTokenCaptcha: tokenCaptcha
                },
                dataType: "json",
                beforeSend: function() {
                    $("#loader").show();
                },
                success: function(data) {
                    if (data) {
                        //console.log("ValidarCodigoOtp -> data.mensajes", data.mensajes);
                        var arrSalida = data.mensajes.split('|');
                        var mens = arrSalida[0];
                        var pwd_valor = data.FlagPwdActualizada;
                        var reiniciarPassword = data.ReiniciarPassword;

                        if (mens === "OK_OTP") {                             
                            $("#btn_Aceptar").removeAttr('disabled');
                            $("#btn_ValidarOtp").removeAttr('disabled');
                            if (data.VistaListadoVentas == 1) {
                                var urlVenta = "/Ventas/ListarVentas";
                                window.location.href = urlVenta;
                            } else if (data.VistaPlanilla == 1) {
                                var urlPlanilla = "/Planilla";
                                window.location.href = urlPlanilla;
                            } else {
                                var urlHome = "/Home/Vista";
                                window.location.href = urlHome;
                            }                            
                        } else {
                            $("#loader").hide();
                            $("#codigoOtp").val('');
                            $("#btn_ValidarOtp").removeAttr('disabled');
                            //mostrarAlerta('Estimado usuario, el código de verificación es incorrecto.');
                            mostrarAlerta(mens);
                            if (reiniciarPassword === "1") {
                                $("#cerrarValidarOtp").click();
                            }
                        }
                    }
                },
                error: function(xhr, status, error) {
                    mostrarAlerta('Estimado usuario, se presenta problemas con la validación del código de verificación.');
                    $("#loader").hide();
                    $("input#Usuario").removeAttr('disabled');
                    $("input#Password").removeAttr('disabled');
                    $("#btn_ValidarOtp").removeAttr('disabled');
                    $("#cerrarValidarOtp").click();
                }
            });
        }

        let intervalId = null;
        function iniciarTimer() {

            if (intervalId) {
                clearInterval(intervalId);
            }

            const timerElement = document.getElementById("timer").querySelector("label");
            let tiempo = $("#hiddenTiempoValOtp").val();
            
            var textoCabecera_1 = document.getElementById("textoCabecera_1").querySelector("label");
            var textoCabecera_2 = document.getElementById("textoCabecera_2").querySelector("label");
            var textoCabecera_3 = document.getElementById("textoCabecera_3").querySelector("label");

            textoCabecera_1.textContent = $("#hiddenModalOtp1").val();
            textoCabecera_2.textContent = $("#hiddenModalOtp3").val();
            textoCabecera_3.textContent = $("#hiddenModalOtp2").val();
            
            intervalId = setInterval(function() { //const intervalo = setInterval(function() {
                let minutos = Math.floor(tiempo / 60);
                let segundos = tiempo % 60;

                // Formato con ceros a la izquierda
                let tiempoFormateado = minutos + ':' + (segundos < 10 ? '0' : '') + segundos;
                timerElement.textContent = 'Puedes reenviar el código en ' + tiempoFormateado;

                tiempo--;

                if (tiempo < 0) {
                    //clearInterval(intervalo);
                    clearInterval(intervalId);
                    intervalId = null;
                    timerElement.innerHTML = '<a href="#" onclick="reenviarCodigoOtp()" style="color: #FF6A39">Reenviar Código Verificación</a>';
                }
            }, 1000);
        }

                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }                    
                    const timerElement = document.getElementById("timer").querySelector("label");
                    timerElement.textContent = '';

                    //console.log("cerrar modal");
                    $("#Usuario").val('');
                    $("#Password").val('');
                    $("#hiddenIdRequestOtp").val('');
                    $("#btn_Aceptar").removeAttr('disabled');
                });

                $("#codigoOtp").on("input", function () {
                    this.value = this.value.replace(/\D/g, '').slice(0, 6);
                });

            });

            $.ajaxPrefilter(function (options, originalOptions, jqXHR) {
                if (options.type.toUpperCase() === "POST") {
                    $("#TokenHidden").remove();
                    var token = $("input[name^=__RequestVerificationToken]").first();
                    if (!token.length) return;
                    var tokenName = token.attr("name");

                    if (options.contentType.indexOf('application/json') === 0) {
                        options.url += ((options.url.indexOf("?") === -1) ? "?" : "&") + token.serialize();
                    } else if (typeof options.data === 'string' && options.data.indexOf(tokenName) === -1) {
                        options.data += (options.data ? "&" : "") + token.serialize();
                    }
                }
            });

            function validarFormato(a) {
                var encrypt = new JSEncrypt();
                encrypt.setPublicKey($("#divpub").val());
                var result = encrypt.encrypt(a);
                return result;
            }
            
        </script>
